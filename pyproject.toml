[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowrunner-map-converter"
version = "1.1.1"
description = "Convert SnowRunner level paks to GLB, OBJ, PLY, STL, PNG and JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SnowRunner Map Converter contributors" }]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.scripts]
snowrunner-map-converter = "snowrunner_map_converter:main"

[tool.setuptools]
py-modules = [
    "snowrunner_map_converter",
    "sr_mesh",
    "sr_objects",
    "sr_textures",
    "sr_gltf",
    "sr_i18n",
    "sr_print",
    "sr_split",
]
